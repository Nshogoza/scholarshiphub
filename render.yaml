# Render Blueprint -- https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> select this repo -> Apply.
# Render will provision the database and backend service from this file in
# one step. You'll be prompted to fill in the `sync: false` variables below
# (mail credentials, and the frontend URL once it exists) during setup, and
# can edit them any time after in the service's Environment tab.
#
# REQUIRE_EMAIL_VERIFICATION defaults to false here so the public demo works
# without wiring up a real SMTP provider first; flip it to true once MAIL_*
# vars point at a real provider (e.g. Brevo's free tier).
#
# No persistent disk is attached -- Render's free web service tier doesn't
# support them. Uploaded application documents will not survive a restart
# or redeploy on this plan; upgrade the service plan and add a `disk:`
# block back if that matters for your demo.

databases:
  - name: scholarshiphub-db
    plan: free
    databaseName: scholarshiphub
    user: scholarshiphub

services:
  - name: scholarshiphub-backend
    type: web
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: scholarshiphub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: scholarshiphub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: scholarshiphub-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: scholarshiphub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: scholarshiphub-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXP_MIN
        value: 15
      - key: JWT_REFRESH_TOKEN_EXP_DAYS
        value: 7
      - key: LOCKOUT_MAX_ATTEMPTS
        value: 5
      - key: LOCKOUT_DURATION_MINUTES
        value: 15
      - key: EMAIL_VERIFICATION_EXP_HOURS
        value: 24
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: PASSWORD_RESET_EXP_MIN
        value: 30
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_DOMAIN
        value: ""
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
