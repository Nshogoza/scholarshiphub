# Mitigates basic credential-stuffing / brute-force traffic against the auth
# endpoints at the edge, on top of the backend's own account lockout. 10
# requests/minute per IP with a small burst allowance. Must live at the
# `http {}' context level (this file is included there by the base image's
# nginx.conf) -- nginx rejects it inside a `server {}' block.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening headers (CSP is intentionally not set here since it
    # must match Vite's build output exactly; adjust before a public launch
    # if inline scripts are introduced).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8080/api/v1/auth/login;
        include /etc/nginx/proxy_params_scholarshiphub;
    }

    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        include /etc/nginx/proxy_params_scholarshiphub;
    }

    # Client-side routing: any unknown path falls back to index.html so
    # React Router (not Nginx) resolves it.
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
