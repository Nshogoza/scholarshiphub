spring:
  application:
    name: scholarshiphub-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scholarshiphub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Narasha}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must never auto-generate DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_dev_only_secret_key_at_least_256_bits_long_please_replace_in_prod}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXP_MIN:15}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXP_DAYS:7}
    issuer: scholarshiphub

  security:
    lockout:
      max-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}
      duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
    email-verification:
      token-expiration-hours: ${EMAIL_VERIFICATION_EXP_HOURS:24}
      require-verified-email-to-login: ${REQUIRE_EMAIL_VERIFICATION:true}
    password-reset:
      token-expiration-minutes: ${PASSWORD_RESET_EXP_MIN:30}

  upload:
    directory: ${UPLOAD_DIR:./uploads}
    max-file-size-bytes: 10485760
    allowed-content-types: application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document

  cookies:
    secure: ${COOKIE_SECURE:false}
    domain: ${COOKIE_DOMAIN:}

logging:
  level:
    root: INFO
    com.scholarshiphub: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
